<header class="navbar-header" [class.scrolled]="isScrolled">
  <div class="container navbar-container">
    <!-- Brand Logo -->
    <a href="#" class="brand-logo" (click)="closeMobileMenu()">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">ArrowFlow</span>
      <span class="badge-tag badge-cyan">v{{ config.version }}</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-menu">
      <a href="#" class="nav-link">Home</a>
      <a href="#features" class="nav-link">Features</a>
      <a href="#how-it-works" class="nav-link">How It Works</a>
      <a href="#documentation" class="nav-link">Documentation</a>
      <a href="#faq" class="nav-link">FAQ</a>
      <a href="#download" class="nav-link">Download</a>
    </nav>

    <!-- Right Side CTA -->
    <div class="nav-cta">
      <button class="btn-primary btn-nav" (click)="downloadExe()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download for Windows</span>
      </button>

      <!-- Mobile Hamburger Button -->
      <button class="hamburger-btn" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen" aria-label="Toggle navigation menu">
        <svg *ngIf="!mobileMenuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="mobileMenuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="mobile-menu" [class.open]="mobileMenuOpen">
    <a href="#" class="mobile-link" (click)="closeMobileMenu()">Home</a>
    <a href="#features" class="mobile-link" (click)="closeMobileMenu()">Features</a>
    <a href="#how-it-works" class="mobile-link" (click)="closeMobileMenu()">How It Works</a>
    <a href="#documentation" class="mobile-link" (click)="closeMobileMenu()">Documentation</a>
    <a href="#faq" class="mobile-link" (click)="closeMobileMenu()">FAQ</a>
    <a href="#download" class="mobile-link" (click)="closeMobileMenu()">Download</a>
    <button class="btn-primary btn-mobile-cta" (click)="downloadExe(); closeMobileMenu()">
      ⚡ Download ArrowFlow.exe
    </button>
  </div>
</header>
