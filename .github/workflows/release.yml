name: Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "ArrowFlow" --icon "arrowflow.ico" --add-data "arrowflow.ico;." --collect-all pynput main.py

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-asset
          path: dist/ArrowFlow.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run macOS Build Script
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-asset
          path: dist/ArrowFlow.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Asset
        uses: actions/download-artifact@v4
        with:
          name: windows-asset
          path: assets

      - name: Download macOS Asset
        uses: actions/download-artifact@v4
        with:
          name: macos-asset
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/ArrowFlow.exe
            assets/ArrowFlow.dmg
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
